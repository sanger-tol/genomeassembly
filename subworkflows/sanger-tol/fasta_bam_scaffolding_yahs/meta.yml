# yaml-language-server: $schema=https://raw.githubusercontent.com/sanger-tol/nf-core-modules/main/subworkflows/yaml-schema.json
name: "fasta_bam_scaffolding_yahs"
description: |
  Scaffold an assembly FASTA file using Hi-C contacts with YaHS.
keywords:
  - scaffolding
  - hic
  - contact map
  - assembly
components:
  - bedtools/bamtobedsort
  - yahs/makepairsfile
  - pairs_create_contact_maps
  - samtools/faidx:
      git_remote: https://github.com/nf-core/modules.git
  - yahs:
      git_remote: https://github.com/nf-core/modules.git
input:
  - ch_fasta:
      type: file
      description: |
        Channel containing assemblies for scaffolding.
        Structure: [ val(meta), path(fasta) ]
      pattern: "*.{bam/cram/sam}"
  - ch_hic_bam:
      type: file
      description: |
        Channel containing BAM files of Hi-C reads mapped to each assembly.
        Structure: [ val(meta), path(bam) ]
      pattern: "*.{bam/cram/sam}"
output:
  - scaffolds_fasta:
      type: file
      description: |
        Final scaffolds from YaHS in FASTA format
        Structure: [ val(meta), path(fasta) ]
      pattern: "*.fasta"
  - scaffolds_agp:
      type: file
      description: |
        AGP describing how contigs are transformed into final scaffolds
        Structure: [ val(meta), path(agp) ]
      pattern: "*.agp"
  - scaffolds_pairs:
      type: file
      description: |
        Pairs file describing Hi-C contacts between scaffolds, translated from the contigs pairs file
        Structure: [ val(meta), path(pairs) ]
      pattern: "*.pairs.gz"
  - scaffolds_chromsizes:
      type: file
      description: |
        Chromsizes file for the scaffolds. A headerless TSV of format <contigname>\t<size>
        Structure: [ val(meta), path(chromsizes) ]
      pattern: "*.sizes"
  - yahs_bin:
      type: file
      description: |
        YaHS binary file describing Hi-C contacts
        Structure: [ val(meta), path(bin) ]
      pattern: "*.bin"
  - yahs_initial:
      type: file
      description: |
        AGP files describing inital breaks by YaHS
        Structure: [ val(meta), path(agp) ]
      pattern: "*.agp"
  - yahs_intermediate:
      type: file
      description: |
        AGP files describing each scaffolding round by YaHS
        Structure: [ val(meta), path(agp) ]
      pattern: "*.agp"
  - yahs_log:
      type: file
      description: |
        YaHS log file
        Structure: [ val(meta), path(log) ]
      pattern: "*.log"
authors:
  - "@prototaxites"
maintainers:
  - "@prototaxites"
